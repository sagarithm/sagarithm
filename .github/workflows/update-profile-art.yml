name: Update profile art

# Refreshes the contribution graph + stats card SVGs automatically every 12 hours from real data.
# Runs twice daily at ~06:17 UTC and ~18:17 UTC (~11:47 AM & ~11:47 PM IST),
# plus whenever you push to main, plus on-demand via workflow_dispatch.

"on":
  schedule:
    - cron: "17 6,18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, repos, blue graph)
        run: python scripts/render_readme_cards.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph & animated cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
